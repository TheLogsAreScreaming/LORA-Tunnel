name: CardputerZero release

# Publishing a GitHub release tagged cardputer-zero-v<version> (or pushing that tag)
# tests the app, builds the .deb and attaches it to the release, so anyone can
# install it with one command on their CardputerZero.
on:
  push:
    tags: ['cardputer-zero-v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to, for example cardputer-zero-v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'cardputer-zero-v')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cardputer-zero
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pillow numpy cryptography pyserial pytest
      - name: Tag matches the app version
        run: |
          version=$(python -c "import json; print(json.load(open('app-builder.json'))['version'])")
          test "$TAG" = "cardputer-zero-v$version" || { echo "Tag $TAG does not match app version $version"; exit 1; }
      - name: Tests and Recon parity
        run: |
          python -m pytest -q tests
          python tools/sync_recon_data.py --check
          python tools/check_recon_parity.py --cases 60000
      - name: Build the .deb
        run: |
          python tools/build_deb.py --out build
          version=$(python -c "import json; print(json.load(open('app-builder.json'))['version'])")
          cp "build/lora-tunnel_${version}_all.deb" build/lora-tunnel-cardputer-zero.deb
          (cd build && sha256sum *.deb > SHA256SUMS)
      - name: Create or update the GitHub release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "LORA Tunnel for CardputerZero ${TAG#cardputer-zero-v}" \
              --notes-file ../cardputer-zero/RELEASE_NOTES.md --latest=false
          fi
          gh release upload "$TAG" build/*.deb build/SHA256SUMS --clobber
