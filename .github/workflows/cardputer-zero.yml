name: CardputerZero app

on:
  push:
    paths: ['cardputer-zero/**', 'lib/recon/**', 'lib/opendroneid/**', '.github/workflows/cardputer-zero.yml']
  pull_request:
    paths: ['cardputer-zero/**', 'lib/recon/**', 'lib/opendroneid/**', '.github/workflows/cardputer-zero.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cardputer-zero
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'  # Raspberry Pi OS Bookworm ships 3.11
      - name: Install test dependencies
        run: python -m pip install pillow numpy cryptography pyserial pytest
      - name: Unit, engine and UI tests
        run: python -m pytest -q tests
      - name: Recon vendor table matches the firmware source
        run: python tools/sync_recon_data.py --check
      - name: Recon classifier matches the firmware C++ (fixtures and seeded mutations)
        run: python tools/check_recon_parity.py --cases 60000
      - name: Render store screenshots (synthetic traffic)
        run: python tools/render_screens.py --out build/screenshots
      - name: Build the APPLaunch .deb
        run: python tools/build_deb.py --out build
      - uses: actions/upload-artifact@v4
        with:
          name: lora-tunnel-cardputer-zero
          path: |
            cardputer-zero/build/*.deb
            cardputer-zero/build/screenshots/*.png
